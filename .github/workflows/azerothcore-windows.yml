name: Build AzerothCore 3.3.5a (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azerothcore-windows.yml'
      - 'custom/**'
      - 'setup/**'

permissions:
  contents: read

jobs:
  windows-build:
    name: Compile and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      BOOST_ROOT: 'C:\local\boost_1_87_0'
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4
        with:
          path: customization
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: azerothcore/azerothcore-wotlk
          ref: master
          path: azerothcore
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Windows setup PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptDir = Join-Path $PWD 'customization/setup'
          $scripts = @('SETUP_SERVER.ps1', 'DIAGNOSTICS.ps1', 'APPLY_CUSTOM_ITEMS.ps1')
          foreach ($name in $scripts) {
            $file = Join-Path $scriptDir $name
            if (-not (Test-Path $file)) { throw "Missing setup script $name" }
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$errorsFound
            ) | Out-Null
            if ($errorsFound.Count -gt 0) {
              $errorsFound | ForEach-Object { Write-Host $_ }
              throw "PowerShell syntax errors in $name"
            }
            Write-Host "Validated $name"
          }

      - name: Cache Boost and MySQL
        uses: actions/cache@v4
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: azerothcore-windows-boost187-mysql849-v1

      - name: Install Boost 1.87 and MySQL 8.4 client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) {
            $url = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
            $exe = Join-Path $env:RUNNER_TEMP 'boost.exe'
            $success = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe -UserAgent 'azerothcore-ci' -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
                if ((Get-Item $exe).Length -lt 50MB) { throw 'Boost download is too small' }
                $success = $true
                break
              } catch {
                Write-Warning "Boost attempt $attempt failed: $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
              }
            }
            if (-not $success) { throw 'Could not download Boost' }
            $proc = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -PassThru -Wait
            if ($proc.ExitCode -ne 0) { throw "Boost installer exit code: $($proc.ExitCode)" }
            if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost headers missing after install' }
          }
          if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost libraries missing' }

          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
            $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
            Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $zip -UserAgent 'Mozilla/5.0'
            if ((Get-Item $zip).Length -lt 50MB) { throw 'MySQL archive is too small' }
            New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
            Expand-Archive -Path $zip -DestinationPath 'C:\tools\mysql' -Force
            if (Test-Path 'C:\tools\mysql\current') { Remove-Item 'C:\tools\mysql\current' -Recurse -Force }
            Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
          }
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import lib missing' }

          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
            Select-Object -First 1
          if (-not $opensslRoot) { throw 'OpenSSL development installation missing on runner' }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenSSL root: $opensslRoot"

      - name: Install AzerothCore modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/azerothcore/mod-transmog.git azerothcore/modules/mod-transmog
          if ($LASTEXITCODE -ne 0) { throw 'Unable to clone mod-transmog' }
          git clone --depth 1 https://github.com/azerothcore/mod-ah-bot.git azerothcore/modules/mod-ah-bot
          if ($LASTEXITCODE -ne 0) { throw 'Unable to clone mod-ah-bot' }
          Write-Host "Transmog revision: $(git -C azerothcore/modules/mod-transmog rev-parse HEAD)"
          Write-Host "AH Bot revision: $(git -C azerothcore/modules/mod-ah-bot rev-parse HEAD)"

      - name: Configure AzerothCore using MySQL 8.4.9 headers and library
        shell: bash
        run: |
          cd azerothcore
          export CTOOLS_BUILD=all
          export CCUSTOMOPTIONS='-DMYSQL_INCLUDE_DIR=C:/tools/mysql/current/include -DMYSQL_LIBRARY=C:/tools/mysql/current/lib/mysqlclient.lib'
          ./acore.sh compiler configure

      - name: Verify matching MySQL development files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $PWD 'azerothcore/var/build/obj/CMakeCache.txt'
          if (-not (Test-Path $cache)) { throw 'Missing CMakeCache.txt' }
          $lines = Get-Content -LiteralPath $cache
          $include = $lines | Where-Object { $_ -match '^MYSQL_INCLUDE_DIR:' } | Select-Object -First 1
          $library = $lines | Where-Object { $_ -match '^MYSQL_LIBRARY:' } | Select-Object -First 1
          Write-Host "Selected MySQL include: $include"
          Write-Host "Selected MySQL import library: $library"
          if (-not $include -or -not $include.ToLowerInvariant().Contains('c:/tools/mysql/current/include')) {
            throw 'MySQL headers do not match the packaged MySQL 8.4.9 DLL'
          }
          if (-not $library -or -not $library.ToLowerInvariant().Contains('c:/tools/mysql/current/lib/mysqlclient.lib')) {
            throw 'MySQL import library does not match the packaged MySQL 8.4.9 DLL'
          }

      - name: Compile AzerothCore, modules and extractors
        shell: bash
        run: |
          cd azerothcore
          export CTOOLS_BUILD=all
          ./acore.sh compiler compile

      - name: Install compiled binaries and tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $PWD 'azerothcore/var/build/obj'
          if (-not (Test-Path (Join-Path $build 'CMakeCache.txt'))) {
            throw 'CMake build directory not found'
          }
          # The upstream acore.sh script skips its install phase when OSTYPE=cygwin
          # on GitHub's Windows bash runner, despite successful MSVC compilation.
          # Explicit installation copies EXEs, extractors and configuration files
          # from var/build/obj/bin/Release into env/dist.
          cmake --install $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed with exit code $LASTEXITCODE" }

          $dist = Join-Path $PWD 'azerothcore/env/dist'
          foreach ($exe in @('authserver.exe', 'worldserver.exe')) {
            $installed = Get-ChildItem -Path $dist -Recurse -File -Filter $exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $installed) { throw "Required $exe missing after CMake install" }
            Write-Host "Verified installed $exe at $($installed.FullName)"
          }

      - name: Package compiled binaries, configs and required runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $PWD 'azerothcore/env/dist'
          if (-not (Test-Path $src)) { throw 'AzerothCore install directory azerothcore/env/dist not found' }
          $world = Get-ChildItem -Path $src -Recurse -File -Filter 'worldserver.exe' | Select-Object -First 1
          $auth  = Get-ChildItem -Path $src -Recurse -File -Filter 'authserver.exe' | Select-Object -First 1
          if (-not $world -or -not $auth) { throw 'Compilation did not produce worldserver.exe and authserver.exe' }

          $dest = Join-Path $PWD 'deliver/AzerothCore-Windows-x64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dest -Recurse -Force
          $relativeBin = [System.IO.Path]::GetRelativePath($src, $world.DirectoryName)
          $destBin = Join-Path $dest $relativeBin
          New-Item -ItemType Directory -Force -Path $destBin | Out-Null
          Write-Host "Executable folder: $relativeBin"

          # Always place the 8.4.9 client DLL next to EXEs, replacing any
          # DLL left by CMake or found in a runner's preinstalled MySQL 8.0.
          $mysqlDir = 'C:\tools\mysql\current'
          $mysqlDll = Get-ChildItem -Path $mysqlDir -Recurse -File -Filter 'libmysql.dll' |
            Select-Object -First 1
          if (-not $mysqlDll) { throw 'MySQL 8.4.9 libmysql.dll missing from pinned client package' }
          Copy-Item -LiteralPath $mysqlDll.FullName -Destination (Join-Path $destBin 'libmysql.dll') -Force
          Write-Host "Bundled pinned MySQL DLL: $($mysqlDll.FullName)"
          $header = Join-Path $mysqlDir 'include/mysql_version.h'
          if (-not (Test-Path $header)) { throw 'MySQL version header is missing' }
          $versionHeader = Get-Content -LiteralPath $header -Raw
          if ($versionHeader -notmatch '(?m)^\s*#define\s+MYSQL_VERSION_ID\s+80409\b') {
            throw 'Unexpected MySQL header version. Expected 8.4.9 (80409)'
          }
          $info = "MySQL compile-time headers: 8.4.9 (80409)" + [Environment]::NewLine +
            "MySQL client DLL: $($mysqlDll.FullName)" + [Environment]::NewLine +
            "MySQL client DLL file version: $($mysqlDll.VersionInfo.FileVersion)"
          $info | Set-Content -Path (Join-Path $dest 'MYSQL_VERSION.txt') -Encoding utf8

          # AzerothCore's SetupLibrariesForWindows() requires legacy.dll
          # alongside authserver.exe and worldserver.exe. Bundle the provider
          # from the same OpenSSL installation as both runtime DLLs.
          $opensslRoot = $env:OPENSSL_ROOT_DIR
          if (-not $opensslRoot -or -not (Test-Path -LiteralPath $opensslRoot)) {
            throw 'Missing configured OPENSSL_ROOT_DIR during packaging'
          }
          $opensslFiles = @('libssl-3-x64.dll', 'libcrypto-3-x64.dll', 'legacy.dll')
          foreach ($dll in $opensslFiles) {
            $found = Get-ChildItem -LiteralPath $opensslRoot -Recurse -File -Filter $dll -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) {
              throw "Required OpenSSL runtime component $dll was not found under $opensslRoot"
            }
            Copy-Item -LiteralPath $found.FullName -Destination (Join-Path $destBin $dll) -Force
            Write-Host "Bundled OpenSSL runtime: $dll from $($found.FullName)"
          }
          $legacyPackaged = Join-Path $destBin 'legacy.dll'
          if (-not (Test-Path -LiteralPath $legacyPackaged)) {
            throw 'Packaging error: AzerothCore requires legacy.dll beside server EXEs'
          }
          @(
            "OpenSSL directory: $opensslRoot"
            "OpenSSL legacy provider: $legacyPackaged"
            'OpenSSL shared libraries and legacy provider bundled from one installation.'
          ) | Set-Content -Path (Join-Path $dest 'OPENSSL_RUNTIME.txt') -Encoding utf8

          @'
          AZEROTHCORE 3.3.5a - WINDOWS SERVER BUILD

          This artifact was compiled on the Windows GitHub Actions runner.
          It contains server binaries, configs and extractor tools generated by the AzerothCore build.
          It does NOT include a WoW game client, MySQL server, database contents or extracted maps.

          1) Install and run MySQL 8.4 locally (or configure a compatible remote DB).
          2) Copy *.conf.dist to *.conf (where applicable) and set correct DB credentials.
          3) Initialize AzerothCore auth/characters/world databases according to the official instructions.
          4) Extract maps/vmaps/mmaps/dbc from your own WoW 3.3.5a client with bundled extractors.
          5) Put extracted data where worldserver expects it; start authserver.exe then worldserver.exe.
          6) Use the WoW 3.3.5a client's realmlist set to the server address.

          Official install documentation: https://www.azerothcore.org/wiki/installation
          Compiled from: https://github.com/azerothcore/azerothcore-wotlk
          '@ | Set-Content -Path (Join-Path $dest 'READ_ME_FIRST.txt') -Encoding utf8

      - name: Add custom item SQL and Russian setup guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $from = Join-Path $PWD 'customization/custom'
          $to = Join-Path $PWD 'deliver/AzerothCore-Windows-x64/CUSTOM'
          if (-not (Test-Path $from)) { throw 'Customization files are missing' }
          New-Item -ItemType Directory -Force -Path $to | Out-Null
          Copy-Item -Path (Join-Path $from 'custom_items_ruRU.sql') -Destination $to
          Copy-Item -Path (Join-Path $from 'install_custom_items.cmd') -Destination $to
          Copy-Item -Path (Join-Path $from 'README_RU.md') -Destination $to
          @(
            "Core: $(git -C azerothcore rev-parse HEAD)"
            "Transmog: $(git -C azerothcore/modules/mod-transmog rev-parse HEAD)"
            "AH Bot: $(git -C azerothcore/modules/mod-ah-bot rev-parse HEAD)"
          ) | Set-Content -Path (Join-Path $to 'VERSIONS.txt') -Encoding utf8

      - name: Package first-run Windows setup and SQL database sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $PWD 'deliver/AzerothCore-Windows-x64'
          $setup = Join-Path $PWD 'customization/setup'
          $sourceSql = Join-Path $PWD 'azerothcore/data/sql'
          $sqlTarget = Join-Path $dest 'SQL_SOURCE/data/sql'
          $custom = Join-Path $dest 'CUSTOM'

          if (-not (Test-Path (Join-Path $setup 'SETUP_SERVER.ps1'))) {
            throw 'Setup scripts missing from customization repository'
          }
          if (-not (Test-Path (Join-Path $sourceSql 'base/db_world'))) {
            throw 'AzerothCore base SQL directory missing'
          }
          New-Item -ItemType Directory -Force -Path $sqlTarget | Out-Null
          Copy-Item -Path (Join-Path $sourceSql '*') -Destination $sqlTarget -Recurse -Force
          if (-not (Test-Path (Join-Path $sqlTarget 'base/db_world'))) {
            throw 'SQL source copy failed'
          }

          # Ship module SQL along with the core. The two modules require their
          # own auth/characters/world statements; the core SQL alone is not enough.
          # Preserve the module source directory layout for AzerothCore updater.
          $moduleSqlRoot = Join-Path $dest 'SQL_SOURCE/modules'
          foreach ($mod in @('mod-ah-bot', 'mod-transmog')) {
            $modSource = Join-Path $PWD "azerothcore/modules/$mod/data/sql"
            if (-not (Test-Path -LiteralPath $modSource)) {
              throw "Required SQL for module $mod not found at $modSource"
            }
            $modTarget = Join-Path $moduleSqlRoot "$mod/data/sql"
            New-Item -ItemType Directory -Force -Path $modTarget | Out-Null
            Copy-Item -Path (Join-Path $modSource '*') -Destination $modTarget -Recurse -Force
            Write-Host "Bundled $mod module SQL under SQL_SOURCE/modules"
          }
          $ahFile = Join-Path $moduleSqlRoot 'mod-ah-bot/data/sql/db-world/mod_auctionhousebot.sql'
          if (-not (Test-Path -LiteralPath $ahFile)) {
            throw 'Auction House Bot database initialization SQL was not packaged'
          }
          Write-Host 'Required AH Bot SQL verified.'

          # This additive SQL script fixes missing Transmog module_string rows
          # without removing existing localization, player data or item unlocks.
          $transmogRepair = Join-Path $PWD 'customization/patches/TRANSMOG_STRINGS_SAFE.sql'
          if (-not (Test-Path -LiteralPath $transmogRepair)) {
            throw 'Safe Transmog string recovery SQL missing'
          }
          Copy-Item -LiteralPath $transmogRepair -Destination (Join-Path $custom 'TRANSMOG_STRINGS_SAFE.sql') -Force
          Write-Host 'Bundled non-destructive Transmog module-string recovery SQL.'
          $transmogNpcRepair = Join-Path $PWD 'customization/patches/TRANSMOG_NPC_SAFE.sql'
          if (-not (Test-Path -LiteralPath $transmogNpcRepair)) {
            throw 'Safe Transmog NPC registration SQL missing'
          }
          Copy-Item -LiteralPath $transmogNpcRepair -Destination (Join-Path $custom 'TRANSMOG_NPC_SAFE.sql') -Force
          Write-Host 'Bundled non-destructive Transmog NPC registration SQL.'

          $entrypoints = @(
            'SETUP_SERVER.ps1', 'SETUP_SERVER.cmd',
            'START_SERVER.cmd', 'START_AUTH.cmd', 'START_WORLD.cmd',
            'DIAGNOSTICS.ps1', 'DIAGNOSTICS.cmd', 'PREPARE_EXTRACTORS.cmd',
            'README_RU.txt'
          )
          foreach ($file in $entrypoints) {
            $from = Join-Path $setup $file
            if (-not (Test-Path $from)) { throw "Missing setup file: $file" }
            Copy-Item -LiteralPath $from -Destination (Join-Path $dest $file) -Force
          }

          Copy-Item -Path (Join-Path $setup 'APPLY_CUSTOM_ITEMS.ps1') -Destination $custom -Force
          Copy-Item -Path (Join-Path $setup 'APPLY_CUSTOM_ITEMS.cmd') -Destination $custom -Force

          $extractor = Join-Path $PWD 'azerothcore/apps/extractor/extractor.bat'
          if (-not (Test-Path $extractor)) { throw 'Official extractor.bat missing from source' }
          Copy-Item -LiteralPath $extractor -Destination (Join-Path $dest 'extractor.bat') -Force

          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Data') | Out-Null
          Write-Host 'Included SQL base/updates, first-run setup, extractors, and custom items.'
          Get-ChildItem $dest -Name

      - name: Upload Windows server ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzerothCore-3.3.5a-Windows-x64-Custom
          path: deliver/AzerothCore-Windows-x64/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
